<!DOCTYPE html>
<html>

<head>
  <title>Admin Dashboard</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans, "Inter", sans-serif);background:var(--color-background-tertiary, #f4f5f7);color:var(--color-text-primary, #111)}
    .wrap{max-width:900px;margin:0 auto;padding:24px 16px}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .header h1{font-size:20px;font-weight:500}
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--border-radius-md, 6px);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:var(--font-sans, "Inter", sans-serif);transition:opacity 0.15s}
    .btn-blue{background:#378add;color:#fff}
    .btn-blue:hover{opacity:0.88}
    .btn-sm{padding:5px 11px;font-size:12px}
    .btn-outline{background:transparent;border:0.5px solid var(--color-border-secondary, #ccc);color:var(--color-text-secondary, #444)}
    .btn-outline:hover{background:var(--color-background-secondary, #eaeaea)}
    .btn-red{background:#fcebeb;color:#a32d2d;border:0.5px solid #f7c1c1}
    .btn-red:hover{background:#f7c1c1}

    .form-card{background:var(--color-background-primary, #fff);border:0.5px solid var(--color-border-tertiary, #e0e0e0);border-radius:var(--border-radius-lg, 8px);padding:20px;margin-bottom:24px}
    .form-card h2{font-size:15px;font-weight:500;margin-bottom:16px;color:var(--color-text-primary, #111)}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
    .fg label{font-size:11px;font-weight:500;color:var(--color-text-secondary, #666);text-transform:uppercase;letter-spacing:0.06em}
    .fg input,.fg textarea,.fg select{border:0.5px solid var(--color-border-secondary, #ccc);border-radius:var(--border-radius-md, 6px);padding:8px 10px;font-size:13px;color:var(--color-text-primary, #111);background:var(--color-background-secondary, #fafafa);font-family:var(--font-sans, "Inter", sans-serif);outline:none}
    .fg input:focus,.fg textarea:focus,.fg select:focus{border-color:#378add;box-shadow:0 0 0 2px rgba(55,138,221,0.15)}
    .fg textarea{resize:vertical;min-height:80px;line-height:1.5}
    .form-actions{display:flex;gap:8px;margin-top:4px}

    .table-card{background:var(--color-background-primary, #fff);border:0.5px solid var(--color-border-tertiary, #e0e0e0);border-radius:var(--border-radius-lg, 8px);overflow:hidden}
    .table-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:0.5px solid var(--color-border-tertiary, #e0e0e0)}
    .table-header h2{font-size:14px;font-weight:500}
    .table-header input{border:0.5px solid var(--color-border-secondary, #ccc);border-radius:var(--border-radius-md, 6px);padding:6px 10px;font-size:12px;color:var(--color-text-primary, #111);background:var(--color-background-secondary, #fafafa);font-family:var(--font-sans, "Inter", sans-serif);outline:none;width:180px}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    th{padding:9px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--color-text-tertiary, #888);font-weight:500;border-bottom:0.5px solid var(--color-border-tertiary, #e0e0e0);background:var(--color-background-secondary, #f9f9f9)}
    td{padding:12px 14px;font-size:13px;color:var(--color-text-secondary, #555);border-bottom:0.5px solid var(--color-border-tertiary, #e0e0e0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:var(--color-background-secondary, #fafafa)}
    .title-cell{font-weight:500;color:var(--color-text-primary, #111)}
    .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
    .badge-published{background:#eaf3de;color:#3b6d11}
    .badge-draft{background:#faeeda;color:#854f0b}
    .badge-archived{background:#f1efe8;color:#5f5e5a}
    .action-btns{display:flex;gap:6px}
    .empty{text-align:center;padding:32px;color:var(--color-text-tertiary, #888);font-size:13px}

    @media (max-width: 720px){
      .wrap{padding:16px 12px}
      .header{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:18px}
      .header h1{font-size:18px}
      .row2,.row3{grid-template-columns:1fr}
      .form-card{padding:16px}
      .form-actions{flex-direction:column}
      .form-actions .btn{width:100%;justify-content:center}
      .table-header{flex-direction:column;align-items:stretch;gap:10px;padding:14px}
      .table-header input{width:100%}
      .table-card{overflow:visible}
      table,thead,tbody,tr,th,td{display:block;width:100%}
      thead{display:none}
      tbody{display:grid;gap:12px;padding:12px}
      tr{border:0.5px solid var(--color-border-tertiary, #e0e0e0);border-radius:var(--border-radius-md, 6px);background:var(--color-background-primary, #fff);overflow:hidden}
      td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 12px;white-space:normal;text-align:right}
      td::before{content:attr(data-label);flex:0 0 92px;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-text-tertiary, #888);text-align:left}
      .title-cell{display:block;text-align:left}
      .title-cell::before{display:block;margin-bottom:6px}
      .action-btns{width:100%;justify-content:flex-end;flex-wrap:wrap}
      .action-btns .btn{min-height:36px}
      .empty{padding:22px 14px}
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>Admin Dashboard</h1>
    <div class="header-actions">
      <span style="font-size:12px;color:var(--color-text-tertiary, #888)" id="countLabel">0 posts</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="form-card">
    <h2 id="formTitle">Create blog post</h2>
    <div class="fg">
      <label>Title</label>
      <input type="text" id="fTitle" placeholder="Enter blog title...">
    </div>
    <div class="fg">
      <label>Content</label>
      <textarea id="fContent" placeholder="Write your content here..."></textarea>
    </div>
    <div class="row2">
      <div class="fg">
        <label>Category</label>
        <select id="fCategory">
          <option value="Architecture">Architecture</option>
          <option value="Interior Design">Interior Design</option>
          <option value="Urban Planning">Urban Planning</option>
          <option value="Sustainability">Sustainability</option>
        </select>
      </div>
      <div class="fg">
        <label>Status</label>
        <select id="fStatus">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="archived">Archived</option>
        </select>
      </div>
    </div>
    <div class="fg">
      <label>Cover Image</label>
      <input type="file" id="fImage">
    </div>
    <div class="form-actions">
      <button class="btn btn-blue" id="submitBtn" onclick="submitPost()">Create post</button>
      <button class="btn btn-outline" id="cancelBtn" style="display:none" onclick="cancelEdit()">Cancel</button>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <h2>All posts</h2>
      <input type="text" placeholder="Search..." oninput="search(this.value)">
    </div>
    <div id="tableWrap">
      <table>
        <thead>
          <tr>
            <th style="width:30%">Title</th>
            <th style="width:18%">Category</th>
            <th style="width:14%">Status</th>
            <th style="width:14%">Date</th>
            <th style="width:24%">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/blog.js"></script>
</body>
</html>
