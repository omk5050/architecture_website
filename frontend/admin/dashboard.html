<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Dashboard | Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Replaced glass with a slightly lighter color for better text contrast */
      --glass: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.3);
      --accent-blue: #378add;
      /* Main text color is now brighter */
      --color-text-primary: #ffffff;
      /* Label color is a light gray for good separation and contrast */
      --color-text-secondary: rgba(255, 255, 255, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      /* Architectural background with dark overlay for readability */
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                  url('https://images.unsplash.com/photo-1487958449943-2429e8be8625?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--color-text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header Styling */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--color-text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Card Styling (Glassmorphism) */
    .form-card, .table-card {
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h2 {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 25px;
      color: var(--color-text-primary);
    }

    /* Form Elements */
    .fg {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .fg label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .fg input, .fg textarea, .fg select {
      background: rgba(255, 255, 255, 0.08); /* Darker input for better separation */
      border: 1px solid var(--glass-border);
      padding: 12px;
      color: var(--color-text-primary);
      font-size: 14px;
      border-radius: 2px;
      outline: none;
      transition: all 0.3s ease;
    }

    /* Input placeholders are now a visible color */
    .fg input::placeholder, .fg textarea::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .fg input:focus, .fg textarea:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #fff;
    }

    .fg option { background: #222; color: #fff; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      border-radius: 2px;
    }

    .btn-blue { background: #fff; color: #000; }
    .btn-blue:hover { background: var(--accent-blue); color: #fff; }

    .btn-outline { 
      background: transparent; 
      border: 1px solid var(--glass-border); 
      color: var(--color-text-primary); 
    }
    .btn-outline:hover { background: rgba(255,255,255,0.1); }

    .btn-red { background: rgba(255, 107, 107, 0.3); color: #ffcccc; border: 1px solid rgba(255, 107, 107, 0.5); }
    .btn-red:hover { background: #ff6b6b; color: #fff; }

    .btn-sm { padding: 6px 12px; font-size: 10px; }

    /* Table Styling */
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .table-header input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--color-text-primary);
      padding: 8px 15px;
      font-size: 12px;
      border-radius: 20px;
      width: 250px;
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--color-text-secondary); /* Th is now secondary text color */
      padding: 15px;
      border-bottom: 1px solid var(--glass-border);
    }
    td {
      padding: 15px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 2px;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
    }
    /* Brightened badge text colors for visibility */
    .badge-published { background: rgba(100, 255, 100, 0.15); color: #88ff88; border: 1px solid rgba(100, 255, 100, 0.3); }
    .badge-draft { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid var(--glass-border); }

    .action-btns { display: flex; gap: 8px; }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .row2 { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; gap: 20px; }
      .table-header { flex-direction: column; gap: 15px; align-items: flex-start; }
      .table-header input { width: 100%; }
      th { display: none; }
      td { display: block; text-align: right; border: none; padding: 10px 0; }
      /* Brightened data-label for mobile */
      td::before { content: attr(data-label); float: left; color: var(--color-text-secondary); font-size: 11px; text-transform: uppercase; }
      .action-btns { justify-content: flex-end; margin-top: 10px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
    }

    /* Modal Styling */
    .custom-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .custom-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .custom-modal {
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }
    .custom-modal-overlay.active .custom-modal {
      transform: translateY(0);
    }
    .custom-modal h3 {
      font-size: 1.1rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      color: var(--color-text-primary);
    }
    .custom-modal p {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .custom-modal-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>Studio Dashboard</h1>
    <div class="header-actions">
      <span style="font-size:12px; text-transform: uppercase; letter-spacing: 1px; color: var(--color-text-secondary)" id="countLabel">0 items found</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="form-card">
    <h2 id="formTitle">Record Entry</h2>
    <div class="fg">
      <label>Project Title</label>
      <input type="text" id="fTitle" placeholder="e.g. Modernist Concrete Villa">
    </div>
    <div class="fg">
      <label>Narrative Content</label>
      <textarea id="fContent" placeholder="Describe the architectural intent..."></textarea>
    </div>
    
    <div class="row2">
      <div class="fg">
        <label>Sector</label>
        <select id="fCategory">
          <option value="Architecture">Architecture</option>
          <option value="Interior Design">Interior Design</option>
          <option value="Urban Planning">Urban Planning</option>
          <option value="Sustainability">Sustainability</option>
        </select>
      </div>
      <div class="fg">
        <label>Visibility Status</label>
        <select id="fStatus">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="archived">Archived</option>
        </select>
      </div>
    </div>

    <div class="fg">
      <label>High-Res Imagery</label>
      <input type="file" id="fImage">
    </div>

    <div class="form-actions">
      <button class="btn btn-blue" id="submitBtn" onclick="submitPost()">Publish Entry</button>
      <button class="btn btn-outline" id="cancelBtn" style="display:none" onclick="cancelEdit()">Discard Changes</button>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <h2>Project Index</h2>
      <input type="text" placeholder="Filter projects..." oninput="search(this.value)">
    </div>
    <div id="tableWrap">
      <table>
        <thead>
          <tr>
            <th style="width:30%">Title</th>
            <th style="width:20%">Category</th>
            <th style="width:15%">Status</th>
            <th style="width:15%">Date</th>
            <th style="width:20%">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody">
          </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Custom Modal -->
<div class="custom-modal-overlay" id="customModalOverlay">
  <div class="custom-modal">
    <h3 id="customModalTitle">Confirm Action</h3>
    <p id="customModalText">Are you sure you want to proceed?</p>
    <div class="custom-modal-actions">
      <button class="btn btn-outline" id="customModalCancel">Cancel</button>
      <button class="btn btn-red" id="customModalConfirm">Confirm</button>
    </div>
  </div>
</div>

<script src="js/blog.js"></script>

<script>
  // Simple logout function for demonstration
  function logout() {
    localStorage.removeItem("token");
    window.location.href = "login.html"; // Redirection to login page
  }
</script>

</body>
</html>
